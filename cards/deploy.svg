<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="294" height="180" viewBox="0 0 294 180">
<defs><style>
  @keyframes fadeUp  {from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn  {from{opacity:0}to{opacity:1}}
  @keyframes grow    {from{transform:scaleY(0.02)}to{transform:scaleY(1)}}
  @keyframes pulse   {0%,100%{opacity:1}50%{opacity:0.3}}
  @keyframes scan    {0%{transform:translateY(0)}100%{transform:translateY(100%)}}
  @keyframes typing  {from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  .a0{animation:fadeUp .5s ease 0.00s both}  .a1{animation:fadeUp .5s ease 0.08s both}
  .a2{animation:fadeUp .5s ease 0.16s both}  .a3{animation:fadeUp .5s ease 0.24s both}
  .a4{animation:fadeUp .5s ease 0.32s both}  .a5{animation:fadeUp .5s ease 0.40s both}
  .a6{animation:fadeUp .5s ease 0.48s both}  .a7{animation:fadeUp .5s ease 0.56s both}
  .a8{animation:fadeUp .5s ease 0.64s both}  .a9{animation:fadeUp .5s ease 0.72s both}
  .f0{animation:fadeIn .6s ease 0.00s both}  .f1{animation:fadeIn .6s ease 0.12s both}
  .f2{animation:fadeIn .6s ease 0.24s both}  .f3{animation:fadeIn .6s ease 0.36s both}
  .f4{animation:fadeIn .6s ease 0.48s both}  .f5{animation:fadeIn .6s ease 0.60s both}
</style><style>@keyframes tiltIn{from{transform:perspective(600px) rotateX(20deg);opacity:0}to{transform:perspective(600px) rotateX(0);opacity:1}}</style></defs>
<rect width="294" height="180" fill="#0f766e"/>

<rect width="294" height="180" fill="#0f766e"/>
<rect x="0" y="0" width="294" height="4" fill="rgba(255,255,255,0.25)"/>
<rect x="0" y="176" width="294" height="4" fill="#0a0a0a"/>
<text x="18" y="32" font-family="Geist Mono","Cascadia Code","Fira Code",Menlo,monospace font-size="10" fill="#0a0a0a" font-weight="700" letter-spacing="0.18em"  class="">DEPLOY</text>
<text x="18" y="104" font-family="Geist",system-ui,-apple-system,sans-serif font-size="38" font-weight="800"
  fill="#0a0a0a" class="a1" style="animation:tiltIn 0.5s ease 0.1s both">Global Infrastructure</text>
<text x="18" y="138" font-family="Geist",system-ui,-apple-system,sans-serif font-size="12" fill="#0a0a0a" font-weight="400"  class="a2">HIREPAT · bsvr.work</text>
