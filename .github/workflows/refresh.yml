name: Refresh profile cards

# Runs daily at 06:17 UTC · on every push to main · on manual trigger
# Fetches real contribution data → renders SVG cards → auto-commits

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render all SVG cards
        run: python scripts/render_cards.py

      - name: Commit updated cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile cards [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
